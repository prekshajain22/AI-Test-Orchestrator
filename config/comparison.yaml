# Comparison run configuration.
# Run: python scripts/compare_runs.py
#
# Each entry under 'runs' specifies a (name, provider, retriever) combination.
# The framework executes every test suite with every combination and produces a
# side-by-side comparison table showing which provider+retriever pair performs
# best on hallucination, faithfulness, relevance, and LLM-judge scores.

runs:
  - name: "Gemini + TF-IDF"
    provider: gemini
    retriever: tfidf
    top_k: 3

  - name: "Gemini + BM25"
    provider: gemini
    retriever: bm25
    top_k: 3

# Test suites to execute for every run.
test_suites:
  - sample_data/prompts/hr_questions.yaml

# Evaluators to run for every configuration.
evaluators:
  - hallucination
  - relevance
  - faithfulness

# Report formats to generate.
# 'comparison' generates the side-by-side HTML comparison table.
reports:
  - json
  - html
  - comparison
