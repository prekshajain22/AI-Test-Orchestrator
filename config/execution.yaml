# Central execution configuration.

# Provider used to generate AI answers
provider:
  name: gemini

# List of prompt test suite files to run.
# Renamed from "tests" -> "test_suites" since there can be any number
# of test suite YAML files, not just one.
test_suites:
  - sample_data/prompts/hr_questions.yaml

# Evaluators to run against each AI response
evaluators:
  - hallucination
  - relevance
  - faithfulness

# Report formats to generate for the run
reports:
  - json
  - html
  - pdf

# RAG (Retrieval-Augmented Generation) settings.
# When enabled: true the execution service chunks each source document and
# uses a TF-IDF retriever to select only the top_k most relevant passages
# as LLM context instead of passing the entire document.
#
# Set enabled: false (the default) to keep the original full-document
# behaviour.  Individual test cases can still opt into RAG by setting
# use_rag: true in their YAML entry regardless of this global flag.
rag:
  enabled: false
  top_k: 3
  retriever: tfidf
